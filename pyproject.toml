[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fcs-deploy-gate"
version = "0.1.0"
description = "Pre-apply gate that stops Terraform deployments which would create CrowdStrike IOMs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest~=9.1", "mypy~=2.4", "ruff~=0.17.1"]

[project.scripts]
fcs-deploy-gate = "fcs_deploy_gate.gate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fcs_deploy_gate = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
